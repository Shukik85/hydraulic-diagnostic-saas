[pytest]
# Pytest configuration for GNN Service
# Python 3.14 + PyTorch + Pydantic v2

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --cov-report=xml
    --cov-config=.coveragerc
    --asyncio-mode=auto
    --maxfail=3
    --durations=10

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (DB, external services)
    slow: Slow tests (>1s execution time)
    gpu: Tests requiring GPU/CUDA
    db: Tests requiring TimescaleDB
    e2e: End-to-end tests

# Asyncio configuration
asyncio_mode = auto

# Warnings
filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:torch.*
    ignore::FutureWarning:torch_geometric.*

# Minimum Python version
minversion = 3.14

# Test collection
norecursedirs =
    .git
    .venv
    venv
    __pycache__
    .pytest_cache
    .mypy_cache
    htmlcov
    dist
    build
    *.egg-info
    _legacy

# Console output
console_output_style = progress

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
