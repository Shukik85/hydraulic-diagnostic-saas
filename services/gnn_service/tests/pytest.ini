[pytest]
# PyTest configuration for GNN service tests

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers
markers =
    unit: unit tests
    integration: integration tests  
    slow: slow tests (timeout > 5s)
    gpu: tests requiring GPU
    smoke: smoke tests
    asyncio: async tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --cov=src
    --cov-report=html
    --cov-report=term-missing:skip-covered
    --asyncio-mode=auto

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# Timeout
timeout = 300
timeout_method = thread

# Asyncio
asyncio_mode = auto
