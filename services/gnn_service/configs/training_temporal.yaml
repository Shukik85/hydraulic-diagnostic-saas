# Production configuration for temporal GNN training
# Based on TimeGNN + GRAPE research papers

model:
  in_channels: 34
  hidden_channels: 128
  num_heads: 8
  num_gat_layers: 3
  lstm_hidden: 256
  lstm_layers: 2
  use_compile: false

training:
  max_epochs: 150
  learning_rate: 0.0005
  weight_decay: 1.0e-05
  batch_size: 16  # Smaller for temporal sequences
  devices: 1
  precision: '16'  # Mixed precision for speed
  accumulate_grad_batches: 2

# Temporal configuration
temporal:
  window_size: 3600  # 1 hour in seconds
  stride: 900  # 15 minutes in seconds
  correlation_threshold: 0.5  # For dynamic edge detection
  propagation_hops: 2  # For missing data imputation

# Data settings
data:
  train_path: data/processed/temporal_train
  val_path: data/processed/temporal_val
  test_path: data/processed/temporal_test
  num_workers: 4
  max_missing_ratio: 0.5  # Handle up to 50% missing data

checkpoint:
  dirpath: checkpoints/temporal_production
  save_top_k: 5
  monitor: val/total_loss
  save_last: true

early_stopping:
  patience: 25  # More patient for temporal
  min_delta: 1.0e-05

logger:
  save_dir: logs/temporal
  name: hydraulic_gnn_temporal
  version: v1

# Loss weights (multi-task)
loss_weights:
  graph_health: 1.0
  graph_degradation: 1.0
  graph_anomaly: 1.0
  graph_rul: 1.0
  component_health: 0.5
  component_anomaly: 0.5
