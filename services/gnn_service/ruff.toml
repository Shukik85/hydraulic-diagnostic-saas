# Ruff Configuration для GNN сервиса
# https://docs.astral.sh/ruff/configuration/
# Современные правила Ruff (v0.8+)
# Python 3.14+ target

# ============================================================================
# TOP-LEVEL SETTINGS (applies globally)
# ============================================================================

# Line length for both linting and formatting
line-length = 100

# Python version target
target-version = "py314"

# Paths to exclude
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "_legacy",
    "htmlcov",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
]

# ============================================================================
# LINT SETTINGS (Primary configuration)
# ============================================================================

[lint]
# Explicitly enable ALL important rule groups
select = [
    # Core linting
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (undefined names, unused imports, etc)
    
    # Import organization & management
    "I",      # isort (import sorting)
    "INP",    # flake8-no-pep420 (missing __init__.py)
    
    # Naming conventions
    "N",      # pep8-naming
    
    # Code quality & upgrades
    "UP",     # pyupgrade (Python 3.14 syntax)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    
    # Security
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    
    # Type checking
    "TCH",    # flake8-type-checking (move typing to TYPE_CHECKING)
    
    # Best practices
    "A",      # flake8-builtins (don't shadow builtins)
    "C90",    # mccabe (complexity)
    "PL",     # pylint rules
    "PERF",   # perflint (performance)
    "FURB",   # refurb (modern patterns)
    "RUF",    # ruff-specific rules
    "PT",     # flake8-pytest-style
    "TRY",    # tryceratops (exception handling)
    "ARG",    # flake8-unused-arguments
    "RET",    # flake8-return
    "SLF",    # flake8-self (private attribute access)
    "ISC",    # flake8-implicit-str-concat
    "G",      # flake8-logging-format
]

# Ignore specific errors that are problematic for this project
ignore = [
    # Line length - we have long type hints, handled by formatter
    "E501",
    
    # Formatter conflicts - let Black/Ruff formatter handle these
    "COM812",   # Trailing comma (conflicts with formatter)
    "ISC001",   # Implicit string concat (conflicts with formatter)
    
    # Testing - assertions are OK in tests
    "S101",     # Use of assert
    
    # ML/Config specific
    "PLR2004",  # Magic values (acceptable in config/ML)
    "PLR0915",  # Too many statements (acceptable in main)
    "PLR0913",  # Too many arguments (model architectures have many)
    
    # Pydantic - boolean fields OK
    "FBT001",   # Boolean positional arg
    "FBT002",   # Boolean default arg
    
    # Russian text handling
    "RUF100",   # Unused noqa (Russian text causes false positives)
    
    # Logging - f-strings are fine for modern Python
    "G004",     # f-string in logging (acceptable in Python 3.14)
    
    # Naming conventions - ML code has different standards
    "N806",     # Variable name should be lowercase (ML uses X, y, etc.)
    
    # Whitespace - autofix handles this
    "W293",     # Blank line contains whitespace (autofix)
    
    # __future__ imports - not needed in Python 3.14
    "UP036",    # outdated __future__ imports
    "UP037",    # quoted annotations (default in 3.14)
    
    # Refurb rules - can be noisy in ML code
    "FURB118",  # operator.itemgetter (not always clearer)
    "FURB140",  # itertools.starmap (verbose for simple cases)
    
    # REMOVED PT004 - deprecated rule in Ruff v0.8+
]

# Per-file ignores - more specific rules for specific files
[lint.per-file-ignores]
# Tests - relaxed rules
"tests/**/*.py" = [
    "S101",     # asserts allowed in tests
    "S102",     # exec allowed in tests
    "S104",     # hardcoded bind all allowed in tests
    "S106",     # hardcoded password allowed in tests
    "ARG",      # unused arguments in fixtures
    "PLR2004",  # magic values in test data
    "SLF001",   # private attribute access in tests
]

# Schemas - Russian docstrings OK
"src/schemas/*.py" = [
    "E501",     # Russian docstrings are long
    "RUF100",   # Russian text in docstrings
]

# Config files
"src/config/*.py" = [
    "PLR2004",  # magic values in config
]

# Legacy code
"src/_legacy/*.py" = [
    "F401",     # unused imports (we're cleaning up)
    "F841",     # unused variables
]

# ML models - different naming conventions
"src/models/**/*.py" = [
    "N806",     # Allow X, y, W, b, etc. in ML code
    "N803",     # Allow UpperCase for tensors
]

# Training code - ML conventions
"src/training/**/*.py" = [
    "N806",     # Allow X, y in training loops
]

# ============================================================================
# ISORT CONFIGURATION (Import sorting)
# ============================================================================

[lint.isort]
known-first-party = ["src"]
known-third-party = [
    "torch",
    "torch_geometric",
    "numpy",
    "pandas",
    "scipy",
    "sklearn",
    "pydantic",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "sqlmodel",
    "lightning",
]

# ============================================================================
# FLAKE8 CONFIGURATION (Various plugins)
# ============================================================================

[lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = false

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "pydantic.Field",
    "torch.nn.Parameter",
]

[lint.flake8-type-checking]
quote-annotations = false
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "pydantic.field_validator",
    "pydantic.model_validator",
]

# ============================================================================
# PYLINT CONFIGURATION (Code complexity)
# ============================================================================

[lint.pylint]
max-args = 10
max-branches = 15
max-returns = 8
max-statements = 80
allow-magic-value-types = ["int", "str", "bytes"]

# ============================================================================
# MCCABE CONFIGURATION (Cyclomatic complexity)
# ============================================================================

[lint.mccabe]
max-complexity = 10

# ============================================================================
# PYDOCSTYLE CONFIGURATION (Docstring style)
# ============================================================================

[lint.pydocstyle]
convention = "google"

# ============================================================================
# FORMAT SETTINGS (Code formatting - Ruff formatter)
# ============================================================================

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false
docstring-code-line-length = "dynamic"
preview = false
