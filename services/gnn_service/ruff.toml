# Ruff Configuration для GNN сервиса
# https://docs.astral.sh/ruff/configuration/
# Современные правила Ruff (v0.8+)
# Python 3.14+ target

# ============================================================================
# BUILD SETTINGS
# ============================================================================

[build]
include = ["*.py", "*.pyi"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "_legacy",
    "htmlcov",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
]
target-version = "py314"

# ============================================================================
# LINT SETTINGS (Primary configuration)
# ============================================================================

[lint]
# Explicitly enable ALL important rule groups
select = [
    # Core linting
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (undefined names, unused imports, etc)
    
    # Import organization & management
    "I",      # isort (import sorting)
    "INP",    # flake8-no-pep420 (missing __init__.py)
    
    # Naming conventions
    "N",      # pep8-naming
    
    # Code quality & upgrades
    "UP",     # pyupgrade (Python 3.14 syntax)
    "B",      # flake8-bugbear (common bugs)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    
    # Security
    "S",      # flake8-bandit
    "BLE",    # flake8-blind-except
    
    # Type checking
    "TCH",    # flake8-type-checking (move typing to TYPE_CHECKING)
    
    # Best practices
    "A",      # flake8-builtins (don't shadow builtins)
    "C90",    # mccabe (complexity)
    "PL",     # pylint rules
    "PERF",   # perflint (performance)
    "FURB",   # refurb (modern patterns)
    "RUF",    # ruff-specific rules
    "PT",     # flake8-pytest-style
    "TRY",    # tryceratops (exception handling)
    "ARG",    # flake8-unused-arguments
    "RET",    # flake8-return
    "SLF",    # flake8-self (private attribute access)
    "ISC",    # flake8-implicit-str-concat
    "G",      # flake8-logging-format
]

# Ignore specific errors that are problematic for this project
ignore = [
    # Line length - we have long type hints, handled by formatter
    "E501",
    
    # Formatter conflicts - let Black/Ruff formatter handle these
    "COM812",   # Trailing comma (conflicts with formatter)
    "ISC001",   # Implicit string concat (conflicts with formatter)
    
    # Testing - assertions are OK in tests
    "S101",     # Use of assert
    
    # ML/Config specific
    "PLR2004",  # Magic values (acceptable in config/ML)
    "PLR0915",  # Too many statements (acceptable in main)
    "PLR0913",  # Too many arguments (model architectures have many)
    
    # Pydantic - boolean fields OK
    "FBT001",   # Boolean positional arg
    "FBT002",   # Boolean default arg
    
    # Russian text handling
    "RUF100",   # Unused noqa (Russian text causes false positives)
    
    # False positives
    "PT004",    # Pytest fixture without underscore prefix (by design)
]

# Per-file ignores - more specific rules for specific files
[lint.per-file-ignores]
# Tests - relaxed rules
"tests/**/*.py" = [
    "S101",     # asserts allowed in tests
    "S102",     # exec allowed in tests
    "S104",     # hardcoded bind all allowed in tests
    "S106",     # hardcoded password allowed in tests
    "ARG",      # unused arguments in fixtures
    "PLR2004",  # magic values in test data
    "SLF001",   # private attribute access in tests
]

# Schemas - Russian docstrings OK
"src/schemas/*.py" = [
    "E501",     # Russian docstrings are long
    "RUF100",   # Russian text in docstrings
]

# Config files
"src/config/*.py" = [
    "PLR2004",  # magic values in config
]

# Legacy code
"src/_legacy/*.py" = [
    "F401",     # unused imports (we're cleaning up)
    "F841",     # unused variables
]

# ============================================================================
# ISORT CONFIGURATION (Import sorting)
# ============================================================================

[lint.isort]
profile = "black"  # Black-compatible import order
known-first-party = ["src"]
known-third-party = [
    "torch",
    "torch_geometric",
    "torch.nn",
    "numpy",
    "pandas",
    "scipy",
    "sklearn",
    "pydantic",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "sqlmodel",
    "lightning",
    "timm",
]
line-length = 100

# ============================================================================
# FLAKE8 CONFIGURATION (Various plugins)
# ============================================================================

[lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = false

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "pydantic.Field",
    "torch.nn.Parameter",
]

[lint.flake8-comprehensions]
# Simplify list/dict/set comprehensions
allow-dict-calls-with-keyword-arguments = false

[lint.flake8-logging-format]
# Standard logging format checking
log-comma-arity = 2

[lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametriaze-values-type = "csv"
parametriaze-values-row-type = "tuple"

[lint.flake8-self]
ignore-names = [
    "_.*",  # private attributes
    "test_.*",  # test methods
]

[lint.flake8-type-checking]
# Move runtime-expensive imports under TYPE_CHECKING
quote-annotations = false
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
]
runtime-evaluated-decorators = [
    "pydantic.field_validator",
    "pydantic.model_validator",
]

# ============================================================================
# PYLINT CONFIGURATION (Code complexity)
# ============================================================================

[lint.pylint]
max-args = 10              # Max function arguments
max-branches = 15          # Max if/else branches
max-returns = 8            # Max return statements
max-statements = 80        # Max statements per function
max-nested-blocks = 6      # Max nesting depth
allow-magic-value-types = ["int", "str", "bytes"]  # Magic values allowed for these types

# ============================================================================
# MCCABE CONFIGURATION (Cyclomatic complexity)
# ============================================================================

[lint.mccabe]
max-complexity = 10  # Max cyclomatic complexity

# ============================================================================
# PYDOCSTYLE CONFIGURATION (Docstring style)
# ============================================================================

[lint.pydocstyle]
convention = "google"  # Google-style docstrings

# ============================================================================
# RUFF-SPECIFIC RULES
# ============================================================================

[lint.ruff]
# Ruff-specific rule configuration
log-level = "debug"  # Logging detail level

# ============================================================================
# FORMAT SETTINGS (Code formatting - Ruff formatter)
# ============================================================================

[format]
# Quote style
quote-style = "double"              # Use double quotes
skip-magic-trailing-comma = false   # Respect trailing comma for multi-line

# Indentation
indent-style = "space"              # Use spaces for indentation

# Line endings
line-ending = "auto"                # Auto-detect line endings (LF on Unix, CRLF on Windows)

# Docstring formatting
docstring-code-format = false        # Don't format code blocks in docstrings
docstring-code-line-length = "dynamic"  # Docstring code line length

# Preview/experimental features (Ruff 0.8+)
preview = false  # Don't use experimental features yet

# ============================================================================
# TOOL ROOT SETTINGS (applies to both lint and format)
# ============================================================================

# Line length applies to both linting and formatting
line-length = 100

# ============================================================================
# NOTEBOOK SETTINGS (For Jupyter notebooks)
# ============================================================================

[notebook]
line-length = 100
